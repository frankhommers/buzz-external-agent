name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install age (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y age dash
      - name: Install age (macOS)
        if: runner.os == 'macOS'
        run: brew install age
      - run: bun install --frozen-lockfile
      - run: bunx biome check .
      - run: bunx tsc --noEmit
      - name: Shellcheck the installer
        if: runner.os == 'Linux'
        run: shellcheck installer/install-agent-key.sh
      - run: bun test
      - name: Installer tests under dash
        if: runner.os == 'Linux'
        run: INSTALLER_SHELL=dash bun test tests/installer.test.ts
      - run: bun run build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Package
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          mkdir -p release
          (cd dist/plugin && zip -r "../../release/selfhosted-agents-$version.zip" .)
          (cd release && sha256sum "selfhosted-agents-$version.zip" > SHA256SUMS)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          # Notes: this version's CHANGELOG section plus install steps, not the whole file.
          awk -v v="## $VERSION" '$0==v{on=1;next} on&&/^## /{exit} on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
          base="https://github.com/$GITHUB_REPOSITORY/blob/$TAG"
          cat >> notes.md <<'NOTES'

          ## Install

          Requires Buzz Desktop 1.0.5 or newer.

          1. Download `selfhosted-agents-@VERSION@.zip`, check it against `SHA256SUMS` and unzip it to a folder.
          2. In Buzz: **Settings → Plugins → Manage plugins → Add → Browse**, and pick that folder.

          Then follow the [owner guide](@BASE@/docs/owner-guide.md) or the [operator guide](@BASE@/docs/operator-guide.md).
          NOTES
          sed -i -e "s#@VERSION@#$VERSION#g" -e "s#@BASE@#$base#g" notes.md
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" release/* --title "Self-hosted agents $VERSION" --notes-file notes.md $flags
